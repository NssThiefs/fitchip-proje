    <div class="bolum">
        <h2 class="bolum-baslik">Bize Ulaşın</h2> 

        <form class="iletisim-form" onsubmit="event.preventDefault();">
            <label>Adınız:</label> 
            <input type="text" placeholder="Adınızı yazın..." required> 

            <label>E-posta:</label> 
            <input type="email" placeholder="ornek@email.com" required>

            <label>Telefon:</label>
            <input type="tel" placeholder="0555 000 00 00" required> 
     
            <label>Mesajınız:</label>
            <textarea rows="5" placeholder="Sipariş, öneri veya talebinizi yazın..." required></textarea>
      
            <button type="submit">Gönder</button>
        </form>
